<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LangChain AI Chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <strong>대화 목록</strong>
        <button id="new-session-btn" class="btn small" title="새 대화">+</button>
      </div>
      <ul id="session-list"></ul>
      <div class="sidebar-footer">
        <button id="settings-btn" class="btn">⚙ 모델 설정</button>
      </div>
    </aside>

    <main id="chat">
      <header id="chat-header">
        <span id="active-title">새 대화</span>
        <span id="model-badge" class="badge"></span>
      </header>
      <div id="messages"></div>
      <form id="input-form">
        <textarea id="input" rows="1" placeholder="메시지를 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
        <button id="send-btn" type="submit">전송</button>
      </form>
    </main>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <h2>모델 설정</h2>
      <p class="hint">ai-service의 ChatOpenAI(base_url)로 전달됩니다. SQLite에 저장됩니다.</p>
      <label>Base URL
        <input id="set-base-url" placeholder="http://mock-llm:8100/v1">
      </label>
      <label>API Key
        <input id="set-api-key" placeholder="mock-key">
      </label>
      <label>Model
        <input id="set-model" placeholder="mock-gpt-4o">
      </label>
      <label>Temperature
        <input id="set-temperature" type="number" step="0.1" min="0" max="2">
      </label>
      <label>Max Tokens (비우면 모델 기본값)
        <input id="set-max-tokens" type="number" min="1" placeholder="예: 512">
      </label>
      <label>System Prompt
        <textarea id="set-system-prompt" rows="3" placeholder="You are a helpful assistant."></textarea>
      </label>
      <div class="modal-actions">
        <button id="settings-cancel" class="btn">취소</button>
        <button id="settings-save" class="btn primary">저장</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
