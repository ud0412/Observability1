# Loki - 단일 바이너리 모드 (local filesystem 저장, 인증/멀티테넌트 비활성)
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP 로그의 구조화 메타데이터(커스텀 레이블) 허용
  allow_structured_metadata: true
  volume_enabled: true